# Dev connection params (no secrets here — use .env or a secret scope)
environment: dev

databricks:
  host: "https://<dev-workspace>.cloud.databricks.com"
  catalog: "dev_catalog"
  schema: "dev_schema"
  table: "source_table"

oracle_adb:
  service_name: "dev_high"
  wallet_dir: "wallet/dev"
  target_schema: "TARGET_SCHEMA"
  target_table: "TARGET_TABLE"

pipeline:
  batch_size: 10000
  log_level: "DEBUG"
