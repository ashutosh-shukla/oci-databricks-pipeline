# ============================================================================
# config.dev.yaml
# Environment: LOCAL DEVELOPMENT
#
# Every value the pipeline needs that could change between environments
# (local -> dev -> prod) lives here, not in Python code. When we move to
# OCI Data Flow later, we'll add a config.prod.yaml with real bucket names,
# compartment IDs, etc. For now, local dev only needs local paths.
# ============================================================================

environment: dev

logging:
  level: DEBUG                # DEBUG locally so we see everything; INFO/WARN in prod later
  log_dir: logs
  log_file: pipeline.log
  console_output: true        # also print logs to terminal, not just the file

paths:
  local_data_dir: data                # where our 3 synthetic CSV batches live
  local_delta_dir: local_warehouse/bronze_transactions   # local Delta table location (no cloud yet)

spark:
  app_name: banking_pipeline_dev
  master: "local[*]"          # run Spark locally using all CPU cores, no cluster yet
  shuffle_partitions: 4       # keep this low locally; small data doesn't need 200 partitions

# OCI and Autonomous DB sections intentionally left empty for now —
# we will not touch cloud services until the local bronze pipeline
# is proven to work end-to-end.
oci:
  enabled: false

autonomous_db:
  enabled: false